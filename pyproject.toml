[project]
name = "shesh-skills"
version = "0.1.0"
description = "Shesh Soma/Mind: everyday MCP tools (notes, web, code, docs, reminders) and skills"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gagan Jain" }]
dependencies = ["fastmcp>=3.4.7,<4", "shesh-audit>=0.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
shesh-skills-mcp = "shesh_skills.server:main"

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM", "I"]
ignore = ["E402"]

[tool.pytest.ini_options]

pythonpath = ["src"]
testpaths = ["tests"]
